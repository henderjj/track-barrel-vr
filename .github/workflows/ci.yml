name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tests run as parallel jobs, each on its own runner: quick checks, the
# emulated-headset test (in three parts) and the two-player network test. The `check` job at
# the end gates on all of them; it is the status check the main ruleset
# requires, so keep its name. See docs/testing.md for how to run each part.
jobs:
  plan:
    # Decides what needs to run. Docs are Markdown, docs/ and LICENSE: no
    # test, build or page loads them.
    # - A change that touches only docs (a pull request against its base, or
    #   a push to main against the main it replaced): the browser tests are
    #   skipped (nothing they load changed).
    # - Push to main whose code (every file but the docs) is exactly code a
    #   pull request already passed every test on: the tests are skipped and
    #   the deploy goes straight out. Docs merged to main in between don't
    #   matter; any other change on main since that run does, and then main
    #   runs everything before it deploys.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      browser: ${{ steps.plan.outputs.browser }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge with the base, whose first
          # parent is the base: depth 2 is enough to list what it changes.
          fetch-depth: 2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          docs='(^docs/|\.md$|^LICENSE$)'
          tree=$(git rev-parse 'HEAD^{tree}')
          # The code's fingerprint: every file but the docs, by content.
          code=$(git ls-tree -r --full-tree HEAD | DOCS="$docs" awk -F'\t' '$2 !~ ENVIRON["DOCS"]' | sha256sum | cut -c1-40)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tests=true
          browser=true
          # What this run changes: a pull request against its base, a push
          # against the commit main was on before it.
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            base=
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
               git fetch --quiet --depth=1 origin "$BEFORE"; then
              base=$BEFORE
            fi
          fi
          if [ -n "$base" ] && git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"
            if [ -s "$RUNNER_TEMP/changed.txt" ] && ! grep -qvE "$docs" "$RUNNER_TEMP/changed.txt"; then
              browser=false
              echo "::notice::Only docs changed: the browser tests are skipped."
            fi
          fi
          if [ "$EVENT" = push ]; then
            # Only a run of this repository's own branches counts (a fork's
            # pull request could name an artifact anything). tested-tree-*
            # is the name pull requests tested before 7 November 2026 left
            # (whole trees, docs included): drop it once those have expired.
            found() {
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=20" \
                --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id != null and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' || echo 0
            }
            passed=$(found "tested-code-$code")
            [ "${passed:-0}" -gt 0 ] || passed=$(found "tested-tree-$tree")
            if [ "${passed:-0}" -gt 0 ]; then
              tests=false
              browser=false
              echo "::notice::This exact code already passed every test on its pull request: deploying without running them again."
            fi
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  quick:
    # Typecheck, unit tests and a production build: about a minute.
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Typecheck the lobby worker
        run: npm ci --prefix lobby && npm run --prefix lobby typecheck

  xr:
    # The emulated-headset test drives an emulated Quest 3 through the IWSDK
    # dev runtime. The runners draw it in software at a frame every 0.5 to
    # 1 s, so all of it took about 36 minutes: it runs in three parts of
    # about 12 minutes each, on three runners at once (XR_PART in
    # scripts/xr-smoke-test.mjs). One part failing doesn't stop the others.
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    name: xr (part ${{ matrix.part }})
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - name: Emulated-headset test
        run: npm run test:xr
        env:
          XR_PART: ${{ matrix.part }}
          # Runners have a display device (/dev/dri/card1) but no GPU. IWSDK
          # takes any such device for a GPU and launches Chromium on hardware
          # GL, which dies on reloads and screenshots. Render in software.
          IWSDK_GPU: swiftshader
      - name: Why the managed browser died
        # Chromium has closed under the test on CI with nothing in its output:
        # show the dev runtime's log and anything the kernel killed.
        if: failure()
        run: |
          tail -n 120 .iwsdk/runtime/logs/*.log || true
          sudo dmesg | grep -iE 'killed process|out of memory|oom|segfault|chrom' | tail -n 30 || true
          free -m
      - name: Stop the dev runtime
        if: always()
        run: npx iwsdk dev down || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xr-artifacts-${{ matrix.part }}
          path: artifacts/*.png
          if-no-files-found: ignore

  net:
    # Two Playwright browsers play together against `vite preview` and the
    # local lobby, on a runner of their own.
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/playwright-chromium
      - name: Two-player network test
        run: npm run test:net
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: net-artifacts
          path: |
            artifacts/*.png
            artifacts/net-report.json
          if-no-files-found: ignore

  check:
    # The status check the main ruleset requires. A job skipped because a job
    # it needs failed counts as passed, so this one runs whatever happened
    # above and fails unless every test job passed or was skipped on purpose.
    needs: [plan, quick, xr, net]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every test passed
        env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.plan.outputs.tests }}
          BROWSER: ${{ needs.plan.outputs.browser }}
          QUICK: ${{ needs.quick.result }}
          XR: ${{ needs.xr.result }}
          NET: ${{ needs.net.result }}
        run: |
          echo "plan $PLAN (tests $TESTS, browser $BROWSER), quick $QUICK, xr $XR, net $NET"
          ok=true
          [ "$PLAN" = success ] || ok=false
          want() { # job result, whether it was meant to run
            if [ "$2" = true ]; then [ "$1" = success ]; else [ "$1" = skipped ]; fi
          }
          want "$QUICK" "$TESTS" || ok=false
          want "$XR" "$BROWSER" || ok=false
          want "$NET" "$BROWSER" || ok=false
          if [ "$ok" != true ]; then
            echo "::error::A test job failed or was cancelled (see the jobs above)."
            exit 1
          fi
      # Records that this exact code passed every test, so main can deploy
      # this merge without testing it again (see the plan job).
      - name: Mark these files as tested
        if: github.event_name == 'pull_request' && needs.plan.outputs.browser == 'true'
        run: echo "${{ github.sha }}" > tested.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' && needs.plan.outputs.browser == 'true'
        with:
          name: tested-code-${{ needs.plan.outputs.code }}
          path: tested.txt
          retention-days: 30
          overwrite: true

  lobby:
    # Deploys the crew lobby (lobby/) to Cloudflare Workers. Until the
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist this job only
    # leaves a notice, so main stays green before Cloudflare is set up.
    # It names check's result itself: by default a job is skipped when any job
    # further up was skipped, as the tests are when main's files were already
    # tested on their pull request. The template repository itself never
    # deploys (and so neither does the game, which waits on this job); a
    # repository made from it does.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !github.event.repository.is_template && needs.check.result == 'success'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Lobby not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see lobby/README.md)."
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lobby/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci --prefix lobby
      - name: Deploy the Worker
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: lobby
        env:
          OWNER: ${{ github.repository_owner }}
          ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          # Only the game's own site may join crews (lobby/wrangler.jsonc).
          origins="${ORIGINS:-https://${OWNER,,}.github.io}"
          npx wrangler deploy --var "ALLOWED_ORIGINS:$origins" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev address in the deploy output. Open Workers & Pages in the Cloudflare dashboard once to pick a workers.dev subdomain."
            exit 1
          fi
          echo "url=wss://${url#https://}" >> "$GITHUB_OUTPUT"
      - name: Store the TURN key as Worker secrets
        if: steps.creds.outputs.ready == 'true' && env.TURN_KEY_ID != '' && env.TURN_KEY_API_TOKEN != ''
        working-directory: lobby
        run: |
          node -e 'process.stdout.write(JSON.stringify({ TURN_KEY_ID: process.env.TURN_KEY_ID, TURN_KEY_API_TOKEN: process.env.TURN_KEY_API_TOKEN }))' \
            | npx wrangler secret bulk

  deploy:
    # Every main-branch build goes to GitHub Pages so a headset can open it by URL.
    # It runs after the lobby job so the build can point at the deployed lobby.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && needs.lobby.result == 'success'
    needs: [check, lobby]
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow's, so checkout needs this
      # again (without it a private repo reads as "not found").
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          # The crew lobby the lobby job just deployed (wss://...), or the
          # LOBBY_URL Actions variable when the lobby is hosted elsewhere.
          VITE_LOBBY_URL: ${{ needs.lobby.outputs.url || vars.LOBBY_URL }}
      # Artifacts from earlier attempts stay on the run, and deploy-pages
      # refuses to pick between two of the same name, so each attempt names
      # its own. Without this, "Re-run failed jobs" can never deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        # The deploy has failed on GitHub's side ("Failed to get ID Token ...
        # socket hang up"). Try once more before failing the job.
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
